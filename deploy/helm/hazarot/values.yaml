image:
  repository: ghcr.io/barakplasma/hazarot
  tag: latest
  pullPolicy: Always
imagePullSecrets: []
# Supply the public digest generated by setup. The actual admin token stays private.
creatorTokenHash: ""
inference:
  baseUrl: ""
  model: ""
  existingSecret: ""
  secretKey: MODEL_API_KEY
analytics:
  enabled: false
limits:
  dailyCalls: 100
  roomCalls: 20
  minuteCalls: 6
  concurrentCalls: 2
persistence:
  existingClaim: ""
  size: 2Gi
  # Empty uses the cluster's default StorageClass.
  storageClass: ""
service:
  type: ClusterIP
  port: 80
ingress:
  enabled: false
  className: ""
  host: ""
  annotations: {}
  tlsSecretName: ""
resources:
  requests: {cpu: 250m, memory: 256Mi}
  limits: {cpu: "2", memory: 1Gi}
nodeSelector: {}
tolerations: []
