name: Phase zero checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Install pinned celld
        run: |
          mkdir -p "$RUNNER_TEMP/celld-bin"
          curl -fsSL https://github.com/denoland/celld/releases/download/v0.6.3/celld-x86_64-unknown-linux-gnu.gz -o "$RUNNER_TEMP/celld.gz"
          gzip -dc "$RUNNER_TEMP/celld.gz" > "$RUNNER_TEMP/celld-bin/celld"
          chmod +x "$RUNNER_TEMP/celld-bin/celld"
          echo "$RUNNER_TEMP/celld-bin" >> "$GITHUB_PATH"
      - run: npm run build
      - run: npm run typecheck
      - run: npm test
      - name: Select browser
        run: |
          chrome="$(command -v google-chrome || command -v chromium || true)"
          if [ -n "$chrome" ]; then
            echo "CHROMIUM_PATH=$chrome" >> "$GITHUB_ENV"
          else
            npx playwright install --with-deps chromium
          fi
      - run: npm run test:browser
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-zero-results
          path: |
            test-results.json
            browser-results.json
            qa/*.png
            qa/browser-runtime.log
            .build/test-runtime.log
  image:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/barakplasma/hazarot:sha-${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/barakplasma/hazarot
